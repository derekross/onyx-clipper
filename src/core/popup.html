<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onyx Clipper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="header-left">
        <img src="icons/icon-32.png" alt="Onyx" class="logo">
        <h1>Onyx Clipper</h1>
      </div>
      <button id="settings-btn" class="icon-btn" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Loading State -->
    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p>Loading page content...</p>
    </div>

    <!-- Main Content -->
    <main id="main-content" class="main-content" style="display: none;">
      <!-- Page Info -->
      <section class="page-info">
        <h2 id="page-title" class="page-title"></h2>
        <p id="page-url" class="page-url"></p>
      </section>

      <!-- Template Selector -->
      <section class="template-section">
        <label for="template-select">Template</label>
        <select id="template-select" class="select">
          <!-- Templates will be populated dynamically -->
        </select>
      </section>

      <!-- Save Location -->
      <section class="location-section">
        <label for="save-path">Save to</label>
        <input type="text" id="save-path" class="input" placeholder="Clippings">
      </section>

      <!-- Filename -->
      <section class="filename-section">
        <label for="filename">Filename</label>
        <input type="text" id="filename" class="input" placeholder="Page title">
      </section>

      <!-- Preview -->
      <section class="preview-section">
        <div class="preview-header">
          <label>Preview</label>
          <button id="toggle-preview" class="text-btn">Show full preview</button>
        </div>
        <div id="preview" class="preview"></div>
      </section>

      <!-- Highlights -->
      <section id="highlights-section" class="highlights-section" style="display: none;">
        <div class="highlights-header">
          <span id="highlight-count">0 highlights</span>
          <label class="checkbox-label">
            <input type="checkbox" id="include-highlights" checked>
            Include highlights
          </label>
        </div>
        <button id="toggle-highlighter" class="secondary-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
          </svg>
          Enable Highlighter
        </button>
      </section>

      <!-- Actions -->
      <section class="actions-section">
        <button id="clip-btn" class="primary-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          Add to Onyx
        </button>
      </section>
    </main>

    <!-- Error State -->
    <div id="error" class="error" style="display: none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h2>Unable to clip this page</h2>
      <p id="error-message">An error occurred while extracting content.</p>
      <button id="retry-btn" class="secondary-btn">Retry</button>
    </div>

    <!-- Success State -->
    <div id="success" class="success" style="display: none;">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
        <polyline points="22 4 12 14.01 9 11.01"></polyline>
      </svg>
      <h2>Clipped to Onyx!</h2>
      <p id="success-message">Your clip has been saved.</p>
    </div>
  </div>

  <script src="browser-polyfill.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
